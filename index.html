<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HÜKÜM Pixel War</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #ffffff; font-family: sans-serif; overflow: hidden; position: fixed; }
        
        /* Tam Ekran Kaydırılabilir Devasa Dünya Haritası */
        #map-viewport { width: 100vw; height: 100vh; overflow: auto; position: absolute; top: 0; left: 0; background: #ffffff; -webkit-overflow-scrolling: touch; }
        #canvas-area { display: grid; grid-template-columns: repeat(300, 16px); grid-template-rows: repeat(300, 16px); width: max-content; height: max-content; background: #ffffff; }
        .pixel { width: 16px; height: 16px; background: #ffffff; border: 0.3px solid #eaeaea; cursor: pointer; background-size: cover; background-position: center; }

        /* Sol Üst Komuta Paneli Butonu */
        #menu-toggle-btn { position: fixed; top: 12px; left: 12px; z-index: 300; background: #b22222; color: #fff; border: none; padding: 10px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 14px; display: none; }
        
        /* Sol Üst Devasa Açılır/Kapanan Komuta Menüsü */
        #left-top-panel { position: fixed; top: 60px; left: 12px; background: rgba(255, 255, 255, 0.98); border: 2px solid #b22222; padding: 15px; border-radius: 10px; z-index: 250; width: 340px; max-height: 80vh; overflow-y: auto; box-shadow: 0 6px 25px rgba(0,0,0,0.3); font-size: 13px; display: none; }
        
        /* Toprak Üzerinde Açılan Mini Savaş/Diplomasi Kutusu */
        #mini-popup { position: absolute; background: #fff; border: 2px solid #b22222; padding: 10px; border-radius: 6px; z-index: 500; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: none; width: 160px; text-align: center; }
        #mini-popup button { width: 100%; padding: 6px; margin: 3px 0; font-size: 12px; background: #b22222; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        #mini-popup button.close-btn { background: #555; }

        /* Ortadaki Modaller (Giriş ve Ordu Kurma) */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border: 2px solid #333; padding: 20px; border-radius: 10px; z-index: 600; width: 90%; max-width: 340px; box-shadow: 0 6px 25px rgba(0,0,0,0.4); text-align: center; }
        
        input, select, button { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; background: #fff; color: #000; }
        .modal button { background: #b22222; color: #fff; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <!-- HARİTA GÖRÜNTÜLEYİCİ -->
    <div id="map-viewport">
        <div id="canvas-area"></div>
        <!-- Toprak Üzeri Mini Diplomasi Kutusu -->
        <div id="mini-popup">
            <b id="popup-army-name" style="font-size:12px; color:#b22222;">Ordu</b>
            <button onclick="sendDiplomacyAction('savas')">Savaş Aç</button>
            <button onclick="sendDiplomacyAction('baris')">Barış İmzala</button>
            <button onclick="sendDiplomacyAction('ittifak')">İttifak Ol</button>
            <button class="close-btn" onclick="closePopup()">Kapat</button>
        </div>
    </div>

    <!-- KOMUTA PANELİ AÇ/KAPA TUŞU -->
    <button id="menu-toggle-btn" onclick="toggleMenu()">Komuta Paneli ☰</button>

    <!-- SOL ÜST DEVASA KOMUTA PANELİ -->
    <div id="left-top-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3 style="color:#b22222; font-size:15px;">Karargah Masası</h3>
            <button onclick="toggleMenu()" style="width:auto; padding:4px 10px; background:#555; margin:0; font-size:12px;">Kapat X</button>
        </div>
        <p><b>Asker:</b> <span id="lbl-user" style="color:#333;"></span></p>
        <p><b>Ordun:</b> <span id="lbl-army" style="color:#b22222;">Yok</span></p>
        <p><b>Rütben:</b> <span id="lbl-rank" style="color:#008000;">Er</span></p>
        <hr style="margin: 10px 0;">
        
        <div id="commander-section" style="display:none;">
            <b style="color:#b22222; font-size:13px;">Paşa / Genelkurmay Yönetimi</b>
            <div id="member-management" style="margin: 8px 0;"></div>
        </div>
    </div>

    <!-- GİRİŞ PENCERESİ -->
    <div id="auth-modal" class="modal">
        <h3 style="margin-bottom:10px;">Askeri Kimlik</h3>
        <input type="text" id="username" placeholder="Kullanıcı Adınız">
        <button onclick="loginUser()">Karargaha Gir</button>
    </div>

    <!-- ORDU SEÇME / KURMA PENCERESİ -->
    <div id="lobby-modal" class="modal" style="display:none;">
        <h3 style="margin-bottom:10px;">Ordu Seç veya Kur</h3>
        <input type="text" id="army-name" placeholder="Ordu İsmi">
        <label style="font-size:11px; text-align:left; display:block; color:#555; margin-top:4px;">Ordu Logosu (Galeriden Seç):</label>
        <input type="file" id="army-logo-file" accept="image/*">
        <button onclick="createArmy()">Orduyu Kur ve Mareşal Ol</button>
        <hr style="margin: 10px 0;">
        <div id="armies-container" style="max-height: 120px; overflow-y: auto;"></div>
    </div>

    <script>
        const GRID_SIZE = 300;
        let currentUser = localStorage.getItem('hukuk_user') || null;
        let usersData = JSON.parse(localStorage.getItem('hukuk_users')) || {};
        let armiesData = JSON.parse(localStorage.getItem('hukuk_armies')) || {};
        let mapData = JSON.parse(localStorage.getItem('hukuk_map')) || {};
        let selectedTargetArmy = null;

        const TSK_RANKS = ["Er", "Onbaşı", "Uzman Çavuş", "Astsubay", "Teğmen", "Üsteğmen", "Yüzbaşı", "Binbaşı", "Yarbay", "Albay", "Tuğgeneral", "Tümgeneral", "Korgeneral", "Orgeneral", "Genelkurmay Başkanı", "Mareşal"];
        const highRanks = ["Tuğgeneral", "Tümgeneral", "Korgeneral", "Orgeneral", "Genelkurmay Başkanı", "Mareşal"];

        window.onload = function() {
            buildGrid();
            const vp = document.getElementById('map-viewport');
            vp.scrollLeft = (vp.scrollWidth - vp.clientWidth) / 2;
            vp.scrollTop = (vp.scrollHeight - vp.clientHeight) / 2;

            if(currentUser && usersData[currentUser]) {
                document.getElementById('username').value = currentUser;
                loginUser();
            }
            setInterval(autoSync, 1000);
        };

        function toggleMenu() {
            const panel = document.getElementById('left-top-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function closePopup() {
            document.getElementById('mini-popup').style.display = 'none';
        }

        function buildGrid() {
            const area = document.getElementById('canvas-area');
            area.innerHTML = '';
            for(let x=0; x<GRID_SIZE; x++) {
                for(let y=0; y<GRID_SIZE; y++) {
                    const key = `${x},${y}`;
                    const div = document.createElement('div');
                    div.className = 'pixel';
                    if(mapData[key]) {
                        div.style.backgroundImage = `url(${mapData[key].logo})`;
                    }
                    div.onclick = (e) => handlePixelClick(key, e, div);
                    area.appendChild(div);
                }
            }
        }

        function loginUser() {
            const name = document.getElementById('username').value.trim();
            if(!name) return alert("Askeri adını yaz!");
            currentUser = name;
            localStorage.setItem('hukuk_user', currentUser);

            if(!usersData[currentUser]) {
                usersData[currentUser] = { army: null, rank: "Er" };
            }

            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('menu-toggle-btn').style.display = 'block';
            
            if(!usersData[currentUser].army) {
                document.getElementById('lobby-modal').style.display = 'block';
            }
            updateUI();
        }

        function createArmy() {
            const name = document.getElementById('army-name').value.trim();
            const fileInput = document.getElementById('army-logo-file');
            if(!name || fileInput.files.length === 0) return alert("Ordu ismi ve logo seçmelisin!");
            if(armiesData[name]) return alert("Bu isimde ordu zaten var!");

            const reader = new FileReader();
            reader.onload = function(e) {
                const logo = e.target.result;
                armiesData[name] = { name: name, logo: logo, marshal: currentUser, diplomacy: {} };
                usersData[currentUser].army = name;
                usersData[currentUser].rank = "Mareşal";

                let center = `${Math.floor(GRID_SIZE/2)},${Math.floor(GRID_SIZE/2)}`;
                mapData[center] = { army: name, logo: logo };

                saveAndRefresh();
                document.getElementById('lobby-modal').style.display = 'none';
                alert("Ordu kuruldu, Başkomutan sensin!");
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function joinArmy(name) {
            if(usersData[currentUser].army) return alert("Zaten bir ordudasın!");
            usersData[currentUser].army = name;
            usersData[currentUser].rank = "Er";
            saveAndRefresh();
            document.getElementById('lobby-modal').style.display = 'none';
        }

        function handlePixelClick(key, e, element) {
            const userArmy = usersData[currentUser].army;
            if(!userArmy) return alert("Önce bir orduya katılmalısın!");

            if(mapData[key] && mapData[key].army !== userArmy) {
                selectedTargetArmy = mapData[key].army;
                const popup = document.getElementById('mini-popup');
                document.getElementById('popup-army-name').innerText = selectedTargetArmy;
                
                popup.style.left = (element.offsetLeft + 20) + 'px';
                popup.style.top = (element.offsetTop - 10) + 'px';
                popup.style.display = 'block';
                e.stopPropagation();
                return;
            }

            closePopup();
            mapData[key] = { army: userArmy, logo: armiesData[userArmy].logo };
            saveAndRefresh();
        }

        function sendDiplomacyAction(action) {
            const myArmy = usersData[currentUser].army;
            const uRank = usersData[currentUser].rank;

            if(!highRanks.includes(uRank)) {
                closePopup();
                return alert("Sadece Paşalar ve Genelkurmay/Mareşal seviyesi diplomatik işlem başlatabilir!");
            }

            if(!selectedTargetArmy) return;
            armiesData[myArmy].diplomacy[selectedTargetArmy] = action;
            saveAndRefresh();
            closePopup();
            alert(selectedTargetArmy + " ordusuna " + action.toUpperCase() + " talebi iletildi!");
        }

        function kickUser(uname) {
            if(confirm(uname + " askeri ihraç edilsin mi?")) {
                usersData[uname].army = null;
                usersData[uname].rank = "Er";
                saveAndRefresh();
            }
        }

        function changeRank(uname, rank) {
            usersData[uname].rank = rank;
            saveAndRefresh();
        }

        function updateUI() {
            const u = usersData[currentUser];
            if(!u) return;
            document.getElementById('lbl-user').innerText = currentUser;
            document.getElementById('lbl-army').innerText = u.army || "Yok";
            document.getElementById('lbl-rank').innerText = u.rank;

            if(u.army && highRanks.includes(u.rank)) {
                document.getElementById('commander-section').style.display = 'block';
                renderCommandPanel(u.army);
            } else {
                document.getElementById('commander-section').style.display = 'none';
            }

            renderArmyList();
        }

        function renderArmyList() {
            const box = document.getElementById('armies-container');
            box.innerHTML = '';
            for(let name in armiesData) {
                box.innerHTML += `<div style="margin:4px 0; background:#f4f4f4; padding:6px; display:flex; justify-content:space-between; align-items:center; border-radius:4px;">
                    <span><b>${name}</b></span>
                    <button onclick="joinArmy('${name}')" style="width:65px; padding:4px; margin:0; font-size:11px;">Katıl</button>
                </div>`;
            }
        }

        function renderCommandPanel(myArmy) {
            const memBox = document.getElementById('member-management');
            memBox.innerHTML = "<b>Ordudaki Askerler:</b><br>";
            for(let uname in usersData) {
                if(usersData[uname].army === myArmy && uname !== currentUser) {
                    memBox.innerHTML += `<div style="margin:4px 0; background:#f9f9f9; padding:4px; border-radius:4px; font-size:12px;">
                        ${uname} (${usersData[uname].rank})
                        <button onclick="kickUser('${uname}')" style="width:45px; background:darkred; float:right; padding:2px; margin:0; font-size:10px;">İhraç</button>
                        <select onchange="changeRank('${uname}', this.value)" style="width:90px; float:right; padding:2px; margin:0 4px 0 0; font-size:10px;">
                            ${TSK_RANKS.map(r => `<option value="${r}" ${usersData[uname].rank === r ? 'selected' : ''}>${r}</option>`).join('')}
                        </select>
                    </div><div style="clear:both;"></div>`;
                }
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('hukuk_users', JSON.stringify(usersData));
            localStorage.setItem('hukuk_armies', JSON.stringify(armiesData));
            localStorage.setItem('hukuk_map', JSON.stringify(mapData));
            updateUI();
            buildGrid();
        }

        function autoSync() {
            usersData = JSON.parse(localStorage.getItem('hukuk_users')) || usersData;
            armiesData = JSON.parse(localStorage.getItem('hukuk_armies')) || armiesData;
            mapData = JSON.parse(localStorage.getItem('hukuk_map')) || mapData;
        }
    </script>
</body>
</html>
