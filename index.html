<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>HÜKÜM Pixel War</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #ffffff; font-family: sans-serif; overflow: hidden; }
        
        /* Devasa Dünya Fetih Haritası (200x200) */
        #canvas-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(200, 10px); grid-template-rows: repeat(200, 10px); background: #ffffff; }
        .pixel { width: 10px; height: 10px; background: #ffffff; border: 0.2px solid #eaeaea; cursor: pointer; background-size: cover; background-position: center; }

        /* Sol Üst Devasa Açılır/Kapanan Komuta Menüsü */
        #menu-toggle-btn { position: fixed; top: 15px; left: 15px; z-index: 300; background: #b22222; color: #fff; border: none; padding: 10px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: none; }
        #left-top-panel { position: fixed; top: 15px; left: 15px; background: rgba(255, 255, 255, 0.98); border: 2px solid #b22222; padding: 15px; border-radius: 8px; z-index: 200; width: 350px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); font-size: 13px; display: none; }
        
        /* Ortadaki Modaller (Giriş ve Ordu Kurma) */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border: 2px solid #333; padding: 20px; border-radius: 8px; z-index: 400; width: 340px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); text-align: center; }
        
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background: #fff; color: #000; }
        button { background: #b22222; color: #fff; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #8b0000; }
    </style>
</head>
<body>

    <!-- HARİTA -->
    <div id="canvas-area"></div>

    <!-- MENÜ AÇ/KAPA BUTONU -->
    <button id="menu-toggle-btn" onclick="toggleMenu()">Komuta Paneli ☰</button>

    <!-- SOL ÜST DEVASA KOMUTA PANELİ -->
    <div id="left-top-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3 style="color:#b22222;">Karargah Masası</h3>
            <button onclick="toggleMenu()" style="width:auto; padding:4px 8px; background:#555;">Kapat X</button>
        </div>
        <p><b>Asker:</b> <span id="lbl-user" style="color:#333;"></span></p>
        <p><b>Ordu:</b> <span id="lbl-army" style="color:#b22222;">Yok</span></p>
        <p><b>Rütbe:</b> <span id="lbl-rank" style="color:#008000;">Er</span></p>
        <hr style="margin: 10px 0;">
        
        <div id="commander-section" style="display:none;">
            <b style="color:#b22222;">Paşa / Genelkurmay Yönetimi</b>
            <div id="member-management" style="margin: 8px 0;"></div>
            <hr style="margin: 10px 0;">
            <b>Diplomasi (Savaş / Barış / İttifak)</b>
            <select id="target-army-select"></select>
            <select id="diplomacy-action">
                <option value="savas">Savaş Aç</option>
                <option value="baris">Barış İmzala</option>
                <option value="ittifak">İttifak Ol</option>
            </select>
            <button onclick="sendDiplomacy()">Diplomatik İşlem Başlat</button>
        </div>
    </div>

    <!-- GİRİŞ PENCERESİ -->
    <div id="auth-modal" class="modal">
        <h3>Askeri Kimlik</h3>
        <input type="text" id="username" placeholder="Kullanıcı Adınız">
        <button onclick="loginUser()">Sisteme Giriş Yap</button>
    </div>

    <!-- ORDU SEÇME / KURMA PENCERESİ -->
    <div id="lobby-modal" class="modal" style="display:none;">
        <h3>Ordu Seç veya Kur</h3>
        <input type="text" id="army-name" placeholder="Ordu İsmi">
        <label style="font-size:11px; text-align:left; display:block; color:#555;">Ordu Logosu (Galeriden Seç):</label>
        <input type="file" id="army-logo-file" accept="image/*">
        <button onclick="createArmy()">Orduyu Kur ve Mareşal Ol</button>
        <hr style="margin: 10px 0;">
        <div id="armies-container" style="max-height: 120px; overflow-y: auto;"></div>
    </div>

    <!-- DİPLOMASİ / SALDIRI TIKLAMA PENCERESİ -->
    <div id="diplomacy-modal" class="modal" style="display:none;">
        <h3 id="target-army-title">Toprak Bilgisi</h3>
        <p id="target-army-info" style="font-size:13px; margin:10px 0;"></p>
        <button onclick="document.getElementById('diplomacy-modal').style.display='none'" style="background:#555;">Kapat</button>
    </div>

    <script>
        const GRID_SIZE = 200; // Devasa Dünya Haritası Pikselleri
        let currentUser = localStorage.getItem('hukuk_user') || null;
        let usersData = JSON.parse(localStorage.getItem('hukuk_users')) || {};
        let armiesData = JSON.parse(localStorage.getItem('hukuk_armies')) || {};
        let mapData = JSON.parse(localStorage.getItem('hukuk_map')) || {};

        const TSK_RANKS = ["Er", "Onbaşı", "Uzman Çavuş", "Astsubay", "Teğmen", "Üsteğmen", "Yüzbaşı", "Binbaşı", "Yarbay", "Albay", "Tuğgeneral", "Tümgeneral", "Korgeneral", "Orgeneral", "Genelkurmay Başkanı", "Mareşal"];
        const highRanks = ["Tuğgeneral", "Tümgeneral", "Korgeneral", "Orgeneral", "Genelkurmay Başkanı", "Mareşal"];

        window.onload = function() {
            buildGrid();
            if(currentUser && usersData[currentUser]) {
                document.getElementById('username').value = currentUser;
                loginUser();
            }
            setInterval(autoSync, 1000);
        };

        function toggleMenu() {
            const panel = document.getElementById('left-top-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function buildGrid() {
            const area = document.getElementById('canvas-area');
            area.innerHTML = '';
            for(let x=0; x<GRID_SIZE; x++) {
                for(let y=0; y<GRID_SIZE; y++) {
                    const key = `${x},${y}`;
                    const div = document.createElement('div');
                    div.className = 'pixel';
                    if(mapData[key]) {
                        div.style.backgroundImage = `url(${mapData[key].logo})`;
                    }
                    div.onclick = () => handlePixelClick(key);
                    area.appendChild(div);
                }
            }
        }

        function loginUser() {
            const name = document.getElementById('username').value.trim();
            if(!name) return alert("Askeri adını yaz!");
            currentUser = name;
            localStorage.setItem('hukuk_user', currentUser);

            if(!usersData[currentUser]) {
                usersData[currentUser] = { army: null, rank: "Er" };
            }

            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('menu-toggle-btn').style.display = 'block';
            
            if(!usersData[currentUser].army) {
                document.getElementById('lobby-modal').style.display = 'block';
            }
            updateUI();
        }

        function createArmy() {
            const name = document.getElementById('army-name').value.trim();
            const fileInput = document.getElementById('army-logo-file');
            if(!name || fileInput.files.length === 0) return alert("Ordu ismi ve logo seçmelisin!");
            if(armiesData[name]) return alert("Bu isimde ordu zaten var!");

            const reader = new FileReader();
            reader.onload = function(e) {
                const logo = e.target.result;
                armiesData[name] = { name: name, logo: logo, marshal: currentUser, diplomacy: {} };
                usersData[currentUser].army = name;
                usersData[currentUser].rank = "Mareşal";

                let center = `${Math.floor(GRID_SIZE/2)},${Math.floor(GRID_SIZE/2)}`;
                mapData[center] = { army: name, logo: logo };

                saveAndRefresh();
                document.getElementById('lobby-modal').style.display = 'none';
                alert("Ordu kuruldu, Başkomutan sensin!");
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function joinArmy(name) {
            if(usersData[currentUser].army) return alert("Zaten bir ordudasın!");
            usersData[currentUser].army = name;
            usersData[currentUser].rank = "Er";
            saveAndRefresh();
            document.getElementById('lobby-modal').style.display = 'none';
        }

        function handlePixelClick(key) {
            const userArmy = usersData[currentUser].army;
            if(!userArmy) return alert("Önce bir orduya katılmalısın!");

            // Başka ordunun toprağına tıklama
            if(mapData[key] && mapData[key].army !== userArmy) {
                const targetArmy = mapData[key].army;
                showDiplomacyModal(targetArmy);
                return;
            }

            // Boş toprak veya kendi toprağını fethetme
            mapData[key] = { army: userArmy, logo: armiesData[userArmy].logo };
            saveAndRefresh();
        }

        function showDiplomacyModal(armyName) {
            const army = armiesData[armyName];
            document.getElementById('target-army-title').innerText = army.name;
            document.getElementById('target-army-info').innerHTML = `Mareşal: <b>${army.marshal}</b><br>Bu orduya karşı sol üstteki komuta panelinden savaş açabilirsin.`;
            document.getElementById('diplomacy-modal').style.display = 'block';
        }

        function kickUser(uname) {
            if(confirm(uname + " askeri ihraç edilsin mi?")) {
                usersData[uname].army = null;
                usersData[uname].rank = "Er";
                saveAndRefresh();
            }
        }

        function changeRank(uname, rank) {
            usersData[uname].rank = rank;
            saveAndRefresh();
        }

        function sendDiplomacy() {
            const target = document.getElementById('target-army-select').value;
            const action = document.getElementById('diplomacy-action').value;
            const myArmy = usersData[currentUser].army;
            if(!target) return alert("Ordu seçmelisin!");
            armiesData[myArmy].diplomacy[target] = action;
            saveAndRefresh();
            alert(target + " ordusuna " + action.toUpperCase() + " talebi iletildi!");
        }

        function updateUI() {
            const u = usersData[currentUser];
            if(!u) return;
            document.getElementById('lbl-user').innerText = currentUser;
            document.getElementById('lbl-army').innerText = u.army || "Yok";
            document.getElementById('lbl-rank').innerText = u.rank;

            if(u.army && highRanks.includes(u.rank)) {
                document.getElementById('commander-section').style.display = 'block';
                renderCommandPanel(u.army);
            } else {
                document.getElementById('commander-section').style.display = 'none';
            }

            renderArmyList();
        }

        function renderArmyList() {
            const box = document.getElementById('armies-container');
            box.innerHTML = '';
            for(let name in armiesData) {
                box.innerHTML += `<div style="margin:5px 0; background:#f4f4f4; padding:6px; display:flex; justify-content:space-between; align-items:center; border-radius:4px;">
                    <span><b>${name}</b></span>
                    <button onclick="joinArmy('${name}')" style="width:70px; padding:4px;">Katıl</button>
                </div>`;
            }
        }

        function renderCommandPanel(myArmy) {
            const memBox = document.getElementById('member-management');
            memBox.innerHTML = "<b>Ordudaki Askerler:</b><br>";
            for(let uname in usersData) {
                if(usersData[uname].army === myArmy && uname !== currentUser) {
                    memBox.innerHTML += `<div style="margin:4px 0; background:#f9f9f9; padding:5px; border-radius:4px; font-size:12px;">
                        ${uname} (${usersData[uname].rank})
                        <button onclick="kickUser('${uname}')" style="width:45px; background:darkred; float:right; padding:2px;">İhraç</button>
                        <select onchange="changeRank('${uname}', this.value)" style="width:90px; float:right; padding:2px; margin-right:4px; font-size:11px;">
                            ${TSK_RANKS.map(r => `<option value="${r}" ${usersData[uname].rank === r ? 'selected' : ''}>${r}</option>`).join('')}
                        </select>
                    </div><div style="clear:both;"></div>`;
                }
            }
            const sel = document.getElementById('target-army-select');
            sel.innerHTML = '';
            for(let name in armiesData) {
                if(name !== myArmy) sel.innerHTML += `<option value="${name}">${name}</option>`;
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('hukuk_users', JSON.stringify(usersData));
            localStorage.setItem('hukuk_armies', JSON.stringify(armiesData));
            localStorage.setItem('hukuk_map', JSON.stringify(mapData));
            updateUI();
            buildGrid();
        }

        function autoSync() {
            usersData = JSON.parse(localStorage.getItem('hukuk_users')) || usersData;
            armiesData = JSON.parse(localStorage.getItem('hukuk_armies')) || armiesData;
            mapData = JSON.parse(localStorage.getItem('hukuk_map')) || mapData;
        }
    </script>
</body>
</html>
